      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
  </style>
</head>
    <body style="background-color: #FAF6EF;">
  
        <nav class="navbar navbar-expand-lg" style="background-color: #FAF6EF;">
          <div class="container-fluid">
              <a class="navbar-brand" href="indexPrincipal.html"><img src="img/logo.png" width="100px"></a>
              <button class="navbar-toggler" type="button" data-bs-toggle="collapse"

              <div class="collapse navbar-collapse">

<div class="form-container">
  <h4 class="mb-3">Tarjeta de crédito o débito</h4>

  <p><strong>Total a pagar:</strong> <span id="montoFinal">₡0.00</span></p>
  
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      let precioTexto = localStorage.getItem("precioSeleccionado");
  
      if (precioTexto) {
        let precioNumerico = parseFloat(
          precioTexto.replace("₡", "").replace(".", "").replace(",", ".")
        );
  
        document.getElementById("montoFinal").textContent = `₡${precioNumerico.toLocaleString("es-CR", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        })}`;
      }
    });
  </script>
  <form onsubmit="return pagar()">
    <div class="mb-3">
      <label class="form-label">Número de la tarjeta</label>
      <input type="text" class="form-control" required>
    </div>
    <div class="row mb-3">
      <div class="col">
        <label class="form-label">Vencimiento</label>
        <input type="text" class="form-control" placeholder="MM/AA" required>
      </div>
      <div class="col">
        <label class="form-label">Código de seguridad</label>
        <input type="text" class="form-control" placeholder="CVV" required>
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label">Nombre del titular</label>
      <input type="text" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Documento de identidad</label>
      <input type="text" class="form-control" placeholder="Ej: 999999999" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Correo electrónico</label>
      <input type="email" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-primary w-100">Pagar</button>
  </form>
</div>

<script>

  document.getElementById("montoFinal").innerText = sessionStorage.getItem("montoTotal") || "₡0.00";

 
  function pagar() {
    alert("Pago procesado ");
    window.location.href = "gracias.html";
    return false;
  }
</script>

</body>
