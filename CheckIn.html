    <div class="container mt-5 mb-5">
        <h2 class="text-center mb-4">Check-in Online</h2>
        <form>
          <div class="mb-3">
            <label for="reserva" class="form-label">Número de Reserva</label>
            <input type="text" class="form-control" id="reserva" placeholder="Ej. 123456">
          </div>
      
          <div class="mb-3">
            <label for="nombre" class="form-label">Nombre Completo</label>
            <input type="text" class="form-control" id="nombre" placeholder="Nombre y Apellidos">
          </div>
      
          <div class="mb-3">
            <label for="documento" class="form-label">Documento de Identidad</label>
            <input type="file" class="form-control" id="file">
          </div>
      
          <div class="mb-3">
            <label for="hora" class="form-label">Hora Estimada de Llegada</label>
            <input type="time" class="form-control" id="hora">
          </div>
      
          <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" id="acepto" required>
            <label class="form-check-label" for="acepto">
              Acepto las políticas y condiciones del hotel
            </label>
          </div>
      
          <button type="submit" class="btn btn-primary w-100">Realizar Check-in</button>
        </form>
      </div>
